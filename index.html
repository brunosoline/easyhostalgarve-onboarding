<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Easy Host Algarve — Ficha de Onboarding</title>
<style>
  :root{
    --green:#324D2E; --green-2:#3F5F3A; --green-tint:#E7ECE2;
    --cream:#F1EEDC; --page:#FAF8EF; --ink:#22301F; --muted:#5F6D59;
    --ok:#2E7D57; --err:#B3452F; --line:#D9DECF; --warn-bg:#FFF6E0; --warn-line:#E8C977;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--page);color:var(--ink);line-height:1.5;font-size:16px}
  .wrap{max-width:660px;margin:0 auto;padding:0 16px 90px}
  header{background:var(--green);color:var(--cream);padding:18px 16px 22px;text-align:center;position:relative}
  header img{width:92px;height:92px;border-radius:16px;margin-bottom:6px}
  header h1{font-size:19px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  header p{font-size:13.5px;opacity:.9;max-width:470px;margin:6px auto 0}
  .lang{position:absolute;top:12px;right:12px;display:flex;border:1.5px solid var(--cream);border-radius:999px;overflow:hidden}
  .lang button{background:transparent;color:var(--cream);border:none;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;border-radius:0}
  .lang button.on{background:var(--cream);color:var(--green)}
  .progress{margin:18px 0 4px;height:8px;background:#E4E8DC;border-radius:999px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
  .plabel{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
  @media (prefers-reduced-motion: reduce){.progress i{transition:none}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-top:10px}
  h2{font-size:19px;color:var(--green);font-weight:800;margin-bottom:2px}
  .sub{font-size:14px;color:var(--muted);margin-bottom:6px}
  h3{font-size:13px;color:var(--green);font-weight:800;margin:22px 0 0;text-transform:uppercase;letter-spacing:.06em;padding-top:14px;border-top:1px solid var(--line)}
  label.f,.flabel{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
  .opt{font-weight:400;color:var(--muted);font-size:13px}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:5px}
  .autofill{font-size:12.5px;color:var(--ok);margin-top:4px;display:none;font-weight:600}
  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;background:#fff;user-select:none;line-height:1.25}
  .chip input{accent-color:var(--green);width:17px;height:17px;cursor:pointer;flex:none;margin:0}
  .chip:has(input:checked){border-color:var(--green);background:var(--green-tint);font-weight:600}
  .chip:has(input:focus-visible){outline:2px solid var(--green);outline-offset:2px}
  .chip.sm{padding:8px 13px;font-size:14px}
  .amen{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  @media(min-width:540px){.amen{grid-template-columns:1fr 1fr 1fr}}
  .amen .chip{border-radius:10px;padding:9px 10px;font-size:13.5px}
  .counters{display:grid;gap:8px}
  .counter{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px 6px 14px;font-size:14.5px}
  .counter .ctl{display:flex;align-items:center;gap:6px}
  .counter button{width:38px;height:38px;padding:0;border-radius:9px;background:var(--green-tint);color:var(--green);font-size:20px;line-height:1}
  .counter output{min-width:26px;text-align:center;font-weight:700;font-size:16px}
  details.help{margin-top:10px;border:1.5px dashed var(--green-2);border-radius:10px;background:var(--green-tint);overflow:hidden}
  details.help summary{cursor:pointer;padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--green);list-style:none;display:flex;align-items:center;gap:8px}
  details.help summary::-webkit-details-marker{display:none}
  details.help summary::before{content:"?";display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--green);color:var(--cream);align-items:center;justify-content:center;font-size:12px;flex:none}
  details.help .body{padding:4px 16px 12px;font-size:13.5px}
  details.help ol,details.help ul{padding-left:20px;display:grid;gap:5px}
  .note{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;background:var(--green-tint);color:var(--ink)}
  .note.warn{background:var(--warn-bg);border:1px solid var(--warn-line)}
  .cond{display:none}.cond.show{display:block}
  .nav{display:flex;gap:10px;margin-top:20px}
  button{font-family:inherit;font-size:15.5px;font-weight:700;border-radius:11px;padding:13px 18px;cursor:pointer;border:none}
  .btn-primary{background:var(--green);color:var(--cream);flex:1}
  .btn-primary:hover{background:var(--green-2)}
  .btn-primary:disabled{opacity:.6;cursor:wait}
  .btn-ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  button:focus-visible,a:focus-visible{outline:3px solid var(--green-2);outline-offset:2px}
  .need{display:grid;gap:8px;margin:12px 0 4px;padding:0;list-style:none}
  .need li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
  .need li b{color:var(--green)}
  .need .ic{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-tint);display:flex;align-items:center;justify-content:center;font-size:14px}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .facts span{font-size:13px;background:var(--page);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted);font-weight:600}
  .review-sec{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
  .review-sec .rh{display:flex;justify-content:space-between;align-items:center;background:var(--page);padding:9px 12px;font-weight:700;font-size:14px;color:var(--green)}
  .review-sec .rh button{background:none;color:var(--green);font-size:13px;padding:4px 6px;text-decoration:underline}
  .review-sec dl{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:4px 12px;padding:10px 12px;font-size:13.5px}
  .review-sec dt{color:var(--muted)}
  .review-sec dd{font-weight:600;word-break:break-word}
  .declbox{border:1.5px solid var(--line);border-radius:10px;padding:14px;font-size:13.5px;background:var(--page);margin-top:14px}
  .req{color:var(--err);font-weight:800}
  input.invalid,textarea.invalid,.choices.invalid,.counters.invalid{outline:2px solid var(--err);outline-offset:2px;border-radius:9px}
  .fieldwarn{font-size:12.5px;color:var(--err);margin-top:4px;font-weight:600}
  .navmsg{display:none;font-size:13.5px;color:var(--err);font-weight:700;text-align:center;margin-top:10px}
  .draftnote{display:none;font-size:12.5px;color:var(--ok);font-weight:600;text-align:center;margin-top:8px}
  .saved{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
  .suggwrap{position:relative}
  .sugg{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1.5px solid var(--line);border-radius:0 0 10px 10px;max-height:220px;overflow:auto;box-shadow:0 8px 20px rgba(34,48,31,.12)}
  .sugg button{display:block;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:10px 12px;font-size:13.5px;font-weight:500;color:var(--ink)}
  .sugg button:hover{background:var(--green-tint)}
  .fallback{display:none;margin-top:14px}
  .fallback .send{display:grid;gap:10px;margin-top:10px}
  .fallback a{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:15px;border-radius:11px;padding:12px 16px}
  .fallback .mail{background:var(--green);color:var(--cream)}
  .fallback .wa{background:#fff;color:var(--ok);border:1.5px solid var(--ok)}
  .privacy{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
  .hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
</style>
</head>

// ---- valores ----
function val(id){var e=document.getElementById(id);return e&&e.value?String(e.value).trim():'';}
function rval(n){var e=document.querySelector('input[name="'+n+'"]:checked');return e?e.value:'';}
function mvals(n){return Array.prototype.map.call(document.querySelectorAll('input[name="'+n+'"]:checked'),function(x){return x.value;});}
function counters(id){var f=FIELDS[id];return f.opts.map(function(op,i){return {k:pt(op),n:parseInt(val(id+'_'+i),10)||0};});}
function fieldValue(f){
  if(f.type==='radio')return rval(f.id);
  if(f.type==='multi'||f.type==='amen')return mvals(f.id).join(', ');
  if(f.type==='counters')return counters(f.id).filter(function(c){return c.n>0;}).map(function(c){return c.n+' '+c.k;}).join(', ');
  return val(f.id);
}
function show(f,v){if(f.type==='date'&&/^\d{4}-\d{2}-\d{2}$/.test(v)){var a=v.split('-');return a[2]+'/'+a[1]+'/'+a[0];}return v;}
function condOk(pair){var ch=document.querySelectorAll('input[name="'+pair[0]+'"]:checked');for(var i=0;i<ch.length;i++){if(pair[1].indexOf(ch[i].value)>-1)return true;}return false;}
function isVisible(f){if(!f.showIf)return true;var c=Array.isArray(f.showIf[0])?f.showIf:[f.showIf];return c.every(condOk);}
function refreshConds(){document.querySelectorAll('.cond').forEach(function(c){c.classList.toggle('show',JSON.parse(c.dataset.conds).every(condOk));});}

function refreshDynamic(){

    var txt=f.hint?t(f.hint):'';

  });

    if(tp&&!isNaN(q)){
      var max=tp==='T0'?2:q*2+2;
      msg=t(["Pela lei, um "+tp+" pode receber até "+max+" hóspedes (2 por quarto + 2 na sala).","By law, a "+(tp==='T0'?"studio":q+"-bedroom")+" can host up to "+max+" guests (2 per bedroom + 2 in the living room)."]);
      if(cap&&cap>max)msg+=' '+t(["O número escolhido está acima — confirmamos consigo.","The number chosen is above that — we'll check with you."]);
    }

var CHECKS={

  email:function(v){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);},

function checkField(f,show){
  if(!f.check)return true;var v=val(f.id);if(!v)return true;
  var ok=CHECKS[f.check](v);var w=document.getElementById('warn_'+f.id);

    var empty=f.req&&!fieldValue(f);

  });});
  var m=document.getElementById('navMsg');m.textContent=t(UI.required);m.style.display=ok?'none':'block';

  var d={step:current,lang:lang,vals:{},checks:[]};
  document.querySelectorAll('#steps input,#steps textarea').forEach(function(e){
    if(e.type==='radio'||e.type==='checkbox'){if(e.checked)d.checks.push(e.name+'||'+e.value);}else if(e.id&&e.value&&e.id!=='website')d.vals[e.id]=e.value;});
  store.set(DRAFT_KEY,JSON.stringify(d));},300);}
function restoreDraft(){
  var raw=store.get(DRAFT_KEY);if(!raw)return false;
  try{var d=JSON.parse(raw),any=false;
    // limpar valores por omissão antes de repor
    Object.keys(d.vals||{}).forEach(function(id){var e=document.getElementById(id);if(e){e.value=d.vals[id];if(e._sync)e._sync();any=true;}});
    var names={};(d.checks||[]).forEach(function(p){names[p.slice(0,p.indexOf('||'))]=1;});
    Object.keys(names).forEach(function(n){document.querySelectorAll('input[name="'+n+'"]').forEach(function(x){x.checked=false;});});
    (d.checks||[]).forEach(function(p){var ix=p.indexOf('||');var inp=document.querySelector('input[name="'+CSS.escape(p.slice(0,ix))+'"][value="'+CSS.escape(p.slice(ix+2))+'"]');if(inp){inp.checked=true;any=true;}});
    if(d.lang)lang=d.lang;
    if(typeof d.step==='number'&&d.step>0&&d.step<TOTAL)current=d.step;
    if(any){var n=document.getElementById('draftNote');n.textContent=t(UI.draft);n.style.display='block';setTimeout(function(){n.style.display='none';},6000);}
    return any;
  }catch(e){return false;}
}
function onAnyChange(){refreshConds();refreshDynamic();saveDraft();}
document.addEventListener('input',function(e){if(e.target.closest&&e.target.closest('#steps')){if(e.target.value)e.target.classList.remove('invalid');if(!document.querySelector('#steps .invalid'))document.getElementById('navMsg').style.display='none';saveDraft();}});
document.addEventListener('change',function(e){
  if(e.target.name){refreshConds();refreshDynamic();var b=document.getElementById('box_'+e.target.name);if(b)b.classList.remove('invalid');}
  if(e.target.id){e.target.classList&&e.target.classList.remove('invalid');}
  if(!document.querySelector('#steps .invalid'))document.getElementById('navMsg').style.display='none';
  saveDraft();});

// ---- arranque ----
var restored=restoreDraft();
if(!restored){var dflt=document.querySelector('input[name="idioma"][value="'+(lang==='en'?'English':'Português')+'"]');if(dflt)dflt.checked=true;}
setLang(lang);
refreshConds();refreshDynamic();render();
</script>
</body>
</html>
