<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Host Algarve — Onboarding</title>
<style>
  :root{
    --green:#324D2E; --green-2:#3F5F3A; --green-tint:#E7ECE2;
    --cream:#F1EEDC; --page:#FAF8EF; --ink:#22301F; --muted:#6C7A66;
    --ok:#2E7D57; --err:#B3452F; --line:#D9DECF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--page);color:var(--ink);line-height:1.5;font-size:16px}
  .wrap{max-width:660px;margin:0 auto;padding:0 18px 90px}
  header{background:var(--green);color:var(--cream);padding:18px 18px 24px;text-align:center;position:relative}
  header img{width:104px;height:104px;border-radius:16px;margin-bottom:8px}
  header h1{font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  header p{font-size:13.5px;opacity:.88;max-width:480px;margin:8px auto 0}
  .lang{position:absolute;top:12px;right:12px;display:flex;border:1.5px solid var(--cream);border-radius:999px;overflow:hidden}
  .lang button{background:transparent;color:var(--cream);border:none;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .lang button.on{background:var(--cream);color:var(--green)}
  .tiles{display:flex;gap:5px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
  .tile{width:32px;height:32px;border:2px solid var(--green);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;color:var(--green);background:#fff;transition:all .2s}
  .tile.done{background:var(--green);color:var(--cream)}
  .tile.now{background:var(--green-tint);box-shadow:0 0 0 3px rgba(50,77,46,.18)}
  .tiles-label{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:12px;font-weight:600}
  @media (prefers-reduced-motion: reduce){.tile{transition:none}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-top:10px}
  h2{font-size:18px;color:var(--green);font-weight:800;margin-bottom:2px}
  .sub{font-size:13.5px;color:var(--muted);margin-bottom:8px}
  h3{font-size:14px;color:var(--green);font-weight:800;margin:18px 0 2px;text-transform:uppercase;letter-spacing:.06em}
  label.f{display:block;font-size:13.5px;font-weight:600;margin:13px 0 5px}
  label.f .opt{font-weight:400;color:var(--muted)}
  input[type=text],input[type=email],input[type=tel],input[type=date],textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  .autofill{font-size:12.5px;color:var(--ok);margin-top:4px;display:none;font-weight:600}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;background:#fff;user-select:none}
  .chip input{accent-color:var(--green);width:17px;height:17px;cursor:pointer;flex:none}
  .chip:has(input:checked){border-color:var(--green);background:var(--green-tint);font-weight:600}
  .chip:has(input:focus-visible){outline:2px solid var(--green);outline-offset:2px}
  .chip.sm{padding:8px 13px;font-size:13.5px}
  .chip.sm input{width:15px;height:15px}
  .amen{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  @media(min-width:520px){.amen{grid-template-columns:1fr 1fr 1fr}}
  .amen .chip{border-radius:10px;padding:8px 10px;font-size:13.5px}
  details.help{margin-top:12px;border:1.5px dashed var(--green-2);border-radius:10px;background:var(--green-tint);overflow:hidden}
  details.help summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--green);list-style:none;display:flex;align-items:center;gap:8px}
  details.help summary::before{content:"?";display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--green);color:var(--cream);align-items:center;justify-content:center;font-size:12px;flex:none}
  details.help .body{padding:10px 16px 13px;font-size:13.5px}
  details.help ol,details.help ul{padding-left:20px;display:grid;gap:6px}
  details.help b{color:var(--green)}
  .cond{display:none}.cond.show{display:block}
  .nav{display:flex;gap:10px;margin-top:22px}
  button{font-family:inherit;font-size:15.5px;font-weight:700;border-radius:11px;padding:13px 18px;cursor:pointer;border:none}
  .btn-primary{background:var(--green);color:var(--cream);flex:1}
  .btn-primary:hover{background:var(--green-2)}
  .btn-ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  button:focus-visible,a:focus-visible{outline:3px solid var(--green-2);outline-offset:2px}
  #resumo{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px;max-height:340px;overflow:auto}
  .send{display:grid;gap:10px;margin-top:14px}
  .send a{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:15.5px;border-radius:11px;padding:13px 18px}
  .send .mail{background:var(--green);color:var(--cream)}
  .send .wa{background:#fff;color:var(--ok);border:1.5px solid var(--ok)}
  .copied{color:var(--ok);font-size:13.5px;text-align:center;margin-top:8px;display:none;font-weight:600}
  .privacy{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
  .declbox{border:1.5px solid var(--line);border-radius:10px;padding:14px;font-size:13.5px;background:var(--page);margin-top:8px}
  .req{color:var(--err);font-weight:800}
  input.invalid,textarea.invalid{border-color:var(--err)}
  .fieldwarn{font-size:12.5px;color:var(--err);margin-top:4px;font-weight:600}
  .navmsg{display:none;font-size:13.5px;color:var(--err);font-weight:700;text-align:center;margin-top:10px}
  .draftnote{display:none;font-size:12.5px;color:var(--ok);font-weight:600;text-align:center;margin-bottom:8px}
  .suggwrap{position:relative}
  .sugg{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1.5px solid var(--line);border-radius:0 0 10px 10px;max-height:220px;overflow:auto;box-shadow:0 8px 20px rgba(34,48,31,.12)}
  .sugg button{display:block;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:10px 12px;font-size:13.5px;font-weight:500;color:var(--ink)}
  .sugg button:hover{background:var(--green-tint)}
</style>
</head>

var lang='pt';
function L(pt){return lang==='en'&&TR[pt]?TR[pt]:pt;}
var REG=[]; // {el, prop, pt}
function reg(el,prop,pt){REG.push({el:el,prop:prop,pt:pt});el[prop]=L(pt);return el;}
function applyLang(){
  REG.forEach(function(r){r.el[r.prop]=L(r.pt);});
  document.querySelectorAll('[data-tr]').forEach(function(e){
    var k=e.getAttribute('data-tr');e.innerHTML=L(TR[k]!==undefined&&k!==TR[k]&&(k==='hdr_sub'||k==='rev_sub'||k==='privacy')?k:k);
    e.innerHTML=(lang==='en'&&TR[k])?TR[k]:(k==='hdr_sub'||k==='rev_sub'||k==='privacy')?e.getAttribute('data-pt')||e.innerHTML:k;
  });
  renderLabel();
}
// simplificação: para os data-tr fixos guardamos o PT original
document.querySelectorAll('[data-tr]').forEach(function(e){e.setAttribute('data-pt',e.innerHTML);});
function applyLangFixed(){
  document.querySelectorAll('[data-tr]').forEach(function(e){
    var k=e.getAttribute('data-tr');
    e.innerHTML=(lang==='en')?(TR[k]||e.getAttribute('data-pt')):(e.getAttribute('data-pt'));
  });
}

function cpLookup(){
  var cp=(document.getElementById('cp').value||'').replace(/\s/g,'');
  var m4=cp.match(/^(\d{4})/);if(!m4)return;
  var hit=CP_MAP[m4[1]];
  if(hit){fillLoc(hit[0],hit[1]);return;}
  var full=cp.match(/^(\d{4})-?(\d{3})$/);
  if(!full)return;
  fetch('https://json.geoapi.pt/cp/'+full[1]+'-'+full[2])
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(!j)return;
      var mun=j.Concelho||j.concelho||(j.Localidade&&j.Localidade[0])||'';
      var dist=j.Distrito||j.distrito||'';
      var freg=j.Freguesia||j.freguesia||'';
      fillLoc(mun,dist,freg);
    }).catch(function(){});
}

function validateStep(i){
  if(i>=STEPS.length)return true;
  var ok=true;
  STEPS[i].secs.forEach(function(sec){sec.fields.forEach(function(f){
    if(!f.req||!isVisible(f))return;
    var e=document.getElementById(f.id);
    var empty=e?!e.value.trim():true;
    if(f.type==='radio')empty=!rval(f.id);
    if(e)e.classList.toggle('invalid',empty);
    if(empty)ok=false;
  });});
  document.getElementById('navMsg').style.display=ok?'none':'block';
  return ok;
}

function val(id){var e=document.getElementById(id);return e&&e.value?e.value.trim():'';}
function rval(name){var e=document.querySelector('input[name="'+name+'"]:checked');return e?e.value:'';}
function mvals(name){return Array.prototype.map.call(document.querySelectorAll('input[name="'+name+'"]:checked'),function(x){return x.value;}).join(', ');}
function isVisible(f){
  if(!f.showIf)return true;
  var conds=Array.isArray(f.showIf[0])?f.showIf:[f.showIf];
  return conds.every(condOk);
}
function buildResumo(){
  var txt='ONBOARDING DO PROPRIETÁRIO — EASY HOST ALGARVE\n================================================\n';
  STEPS.forEach(function(st){st.secs.forEach(function(sec){
    txt+='\n'+sec.h.toUpperCase()+'\n';
    sec.fields.forEach(function(f){
      if(f.type==='declcheck'){
        txt+=(rval('decl_ok')?'✓ AUTORIZAÇÃO CONCEDIDA':'✗ Autorização NÃO assinalada')+' — '+new Date().toLocaleDateString('pt-PT')+'\n';return;
      }
      if(!isVisible(f))return;
      var v=(f.type==='radio')?rval(f.id):(f.type==='multi'||f.type==='amen')?mvals(f.id):val(f.id);
      txt+=f.l+': '+(v||'—')+'\n';
    });
  });});
  document.getElementById('resumo').textContent=txt;
  var subject=encodeURIComponent('Onboarding — '+(val('aloj_nome')||val('nome')||'novo proprietário'));
  document.getElementById('mailBtn').href='mailto:'+DEST_EMAIL+'?subject='+subject+'&body='+encodeURIComponent(txt);
  document.getElementById('waBtn').href='https://wa.me/?text='+encodeURIComponent(txt);
  return txt;
}
function copyText(txt,done){
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(err){done();}document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(fallback);}else{fallback();}
}
document.addEventListener('click',function(e){
  if(e.target.id==='submitBtn'){
    var btn=e.target;
    var txt=buildResumo();
    btn.disabled=true;btn.textContent=L('A enviar…');
    document.getElementById('subErr').style.display='none';

      }).toString();

        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);});
    }
    req
      .then(function(){
        store.del(DRAFT_KEY);

          '<div style="font-size:52px;color:var(--ok)">✓</div>'+

          '<p class="sub" style="margin:0">'+L('sub_ok_p')+'</p></div>';
        window.scrollTo({top:0,behavior:'smooth'});
      })
      .catch(function(){
        document.getElementById('subErr').style.display='block';

      });

  }
  if(e.target.id==='copyBtn'){
    copyText(buildResumo(),function(){document.getElementById('copiedMsg').style.display='block';});

  }
  var mail=e.target.closest?e.target.closest('#mailBtn'):null;

    e.preventDefault();

    // mailto tem limite prático de ~2000 caracteres: corpo completo só se couber
    var body=txt;

      body=txt.split('\n').slice(0,12).join('\n')+'\n\n'+L('[O resumo completo foi copiado — cole-o aqui]');
    }
    copyText(txt,function(){
      document.getElementById('mailMsg').style.display='block';
      setTimeout(function(){window.location.href='mailto:'+DEST_EMAIL+'?subject='+subject+'&body='+encodeURIComponent(body);},250);
    });

});

var _mem={};
var store={
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){_mem[k]=v;}},
  get:function(k){try{return localStorage.getItem(k);}catch(e){return _mem[k]||null;}},
  del:function(k){try{localStorage.removeItem(k);}catch(e){delete _mem[k];}}
};
var DRAFT_KEY='eh_onboarding_draft_v1';
var _saveT=null;
function saveDraft(){
  clearTimeout(_saveT);
  _saveT=setTimeout(function(){
    var d={step:current,vals:{},checks:[]};
    document.querySelectorAll('input,textarea').forEach(function(e){
      if(e.type==='radio'||e.type==='checkbox'){if(e.checked)d.checks.push(e.name+'||'+e.value);}
      else if(e.id&&e.value)d.vals[e.id]=e.value;
    });
    store.set(DRAFT_KEY,JSON.stringify(d));
  },400);
}
function restoreDraft(){
  var raw=store.get(DRAFT_KEY);if(!raw)return;
  try{
    var d=JSON.parse(raw);var any=false;
    Object.keys(d.vals||{}).forEach(function(id){var e=document.getElementById(id);if(e){e.value=d.vals[id];any=true;}});
    (d.checks||[]).forEach(function(pair){
      var ix=pair.indexOf('||');var name=pair.slice(0,ix),v=pair.slice(ix+2);
      var inp=document.querySelector('input[name="'+CSS.escape(name)+'"][value="'+CSS.escape(v)+'"]');
      if(inp){inp.checked=true;any=true;}
    });
    if(typeof d.step==='number'&&d.step>0&&d.step<TOTAL){current=d.step;}
    if(any){document.getElementById('draftNote').style.display='block';setTimeout(function(){document.getElementById('draftNote').style.display='none';},5000);}
  }catch(e){}
}
document.addEventListener('input',saveDraft);
document.addEventListener('change',saveDraft);

(function(){
  var inp=document.getElementById('aloj_morada');var box=document.getElementById('sugg_aloj_morada');
  if(!inp||!box)return;
  var t=null;
  inp.addEventListener('input',function(){
    clearTimeout(t);
    var q=inp.value.trim();
    if(q.length<6){box.style.display='none';return;}
    t=setTimeout(function(){
      fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=pt&addressdetails=1&q='+encodeURIComponent(q),
            {headers:{'Accept':'application/json'}})
       .then(function(r){return r.ok?r.json():[];})
       .then(function(list){
         box.innerHTML='';
         if(!list.length){box.style.display='none';return;}
         list.forEach(function(it){
           var b=document.createElement('button');b.type='button';
           b.textContent=it.display_name;
           b.addEventListener('click',function(){
             var a=it.address||{};
             var street=[a.road||'',a.house_number||''].join(' ').trim();
             var local=a.village||a.town||a.city||'';
             inp.value=street?(street+(local?', '+local:'')):it.display_name;
             var cpEl=document.getElementById('cp');
             if(a.postcode&&cpEl&&!cpEl.value){cpEl.value=a.postcode;}
             fillLoc(a.municipality||a.city||a.town||a.village||'',a.state_district||a.state||'',a.suburb||a.city_district||'');
             box.style.display='none';
             if(cpEl&&cpEl.value)cpLookup();
             saveDraft();
           });
           box.appendChild(b);
         });
         box.style.display='block';
       }).catch(function(){box.style.display='none';});
    },450);
  });
  document.addEventListener('click',function(e){if(!box.contains(e.target)&&e.target!==inp)box.style.display='none';});
})();

restoreDraft();
refreshConds();
render();
</script>
</body>
</html>
